model:
  act: null
  hidden_layer: False
  dino_embed_dim: 768

train:
  lr: 0.0001
  ltype: 'infonce'
  num_epochs: 50
  batch_size: 128
  save_best_model: False

  # Object branch: same as before, computed batch-wise.
  lambda_obj: 240

  # Part branch: still enabled, but updated once per epoch.
  # inst = pooled pseudo visual prototype vs projected text InfoNCE.
  # overlap/spear = accumulated over epoch, then one optimizer.step().
  lambda_inst: 1.0
  lambda_overlap: 20.0
  lambda_spear: 40.0

  num_parts: 59
  epoch_pool_mode: local_pseudo_mean
  epoch_part_temperature: 0.07
  min_pool_count: 1
  pool_update_every: 1
  epoch_pool_warmup_epochs: 0

  present_only_anchor: False

  patch_temperature: 0.07
  em_iters: 1

dataset:
  min_obj_area_ratio: 0.0
